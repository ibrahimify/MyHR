name: CI

on:
  push:
    branches:
      - thesis
  pull_request:
    branches:
      - thesis

jobs:
  test:
    name: Thesis application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile core application modules
        run: |
          python -m py_compile main.py
          python -m py_compile src/ui/main_window.py
          python -m py_compile src/ui/icons.py
          python -m py_compile src/ui/pages/dashboard.py
          python -m py_compile src/ui/pages/settings.py
          python -m py_compile src/ui/pages/audit_log.py
          python -m py_compile src/ui/components/app_select.py

      - name: Run application test suite
        run: python -m unittest discover -s tests
